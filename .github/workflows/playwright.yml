name: Playwright Tests and Email Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests from tests folder
        run: npx playwright test tests/ --reporter=html
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Zip HTML report for email attachment
        if: always()
        run: zip -r playwright-report.zip playwright-report/

      - name: Send test report via email
        if: always()
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: ://gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Playwright Report (${{ job.status }}): ${{ github.repository }}"
          to: kcnkumar@gmail.com
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Playwright tests finished with status: ${{ job.status }}.
            Download and unzip the attached playwright-report.zip to view index.html.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: playwright-report.zip
