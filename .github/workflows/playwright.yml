name: Playwright Tests and Email Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests from tests folder
        run: xvfb-run --auto-servernum -- npx playwright test tests/ --project=chromium --reporter=html
        env:
          PLAYWRIGHT_HTML_OPEN: never
          CI: true

      - name: Zip HTML report for email attachment
        if: always()
        run: |
          if [ -d "playwright-report" ]; then
            zip -r playwright-report.zip playwright-report/
          else
            echo "Playwright report folder was not generated. Check the workflow logs for errors." > report-missing.txt
            zip playwright-report.zip report-missing.txt
          fi
      - name: Combine intro text, pipeline link, and HTML report
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "<p>Following is the last run report.</p>"
            echo "<p><strong>Pipeline Run:</strong> <a href=\"${RUN_URL}\">${RUN_URL}</a></p>"
            echo "<hr>"
            if [ -f "playwright-report/index.html" ]; then
              cat playwright-report/index.html
            else
              echo "<p>No HTML report was generated. Check the pipeline link above for error logs.</p>"
            fi
          } > combined-report.html

      - name: Send test report via email
        if: always()
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Playwright Report (${{ job.status }}): ${{ github.repository }}"
          to: kcnkumar@gmail.com
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          html_body: file://combined-report.html
#           body: |
